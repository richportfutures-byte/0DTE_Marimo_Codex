[project]
name = "codex-0dte-notebook"
version = "0.1.0"
description = "A marimo reference app scaffold for 0DTE SPX/SPXW inventory workflows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "marimo",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spx_inventory_playbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
